<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>학습 게임 컬렉션</title>
  
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-radius: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    /* 상단 블루 헤더 */
    .header-wrapper {
      width: 100%;
      background: linear-gradient(180deg, #1e3a8a 0%, #1d4ed8 100%);
      padding: 24px 20px 28px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 8px 20px -4px rgba(29, 78, 216, 0.35);
      display: flex;
      justify-content: center;
    }

    .header-content {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
    }

    .top-bar h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .refresh-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .refresh-btn:active {
      transform: rotate(180deg);
    }

    /* 검색창 */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1.05rem;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      padding: 0 16px 0 46px;
      font-size: 0.95rem;
      outline: none;
      box-shadow: var(--shadow-md);
    }

    /* 메인 컨테이너 */
    .main-container {
      width: 100%;
      max-width: 900px;
      padding: 20px 16px 0;
    }

    /* 카테고리 칩 */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: #ffffff;
      color: #475569;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(29, 78, 216, 0.35);
    }

    /* 게임 카드 리스트 / 그리드 */
    .game-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .game-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    /* 개별 게임 카드 */
    .game-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #f8fafc;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .card-thumb {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      object-fit: cover;
      background: #f1f5f9;
      flex-shrink: 0;
      border: 1px solid #e2e8f0;
    }

    .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* 카드 하단 플레이 버튼 정렬 */
    .card-bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 4px;
    }

    .play-btn {
      padding: 7px 22px;
      background: #1e3a8a;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .play-btn:hover {
      background: var(--primary);
      transform: scale(1.02);
    }

    /* 상태 메시지 */
    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      grid-column: 1 / -1;
    }
    .status-msg i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 상단 블루 헤더 -->
  <header class="header-wrapper">
    <div class="header-content">
      <div class="top-bar">
        <h1>학습 게임 컬렉션</h1>
        <button class="refresh-btn" onclick="fetchGamesFromSheet()" title="새로고침">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
      <!-- 검색창 -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="게임 제목 또는 내용 검색..." />
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="main-container">
    <div class="category-scroll" id="categoryTabs"></div>
    <div class="game-list" id="gameList">
      <div class="status-msg">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>게임 목록을 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <script>
    const GOOGLE_SHEET_ID = "1wkQL5hJ_ocYOPhD2E3BG5q94JtHgxWIPP4TGC2iBs4E";

    let games = [];
    let selectedCategory = '전체';
    let searchQuery = '';

    // 구글 시트 데이터 불러오기
    function fetchGamesFromSheet() {
      const listContainer = document.getElementById('gameList');
      listContainer.innerHTML = `
        <div class="status-msg">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p>최신 게임 목록을 불러오는 중입니다...</p>
        </div>
      `;

      const oldScript = document.getElementById('gviz-sheet-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz-sheet-script';
      script.src = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetData&t=${Date.now()}`;
      
      script.onerror = function() {
        listContainer.innerHTML = `
          <div class="status-msg">
            <i class="fa-solid fa-circle-exclamation" style="color: #ef4444;"></i>
            <p>구글 시트를 읽어오지 못했습니다.<br>구글 시트의 [공유] 설정이 '링크가 있는 모든 사용자(뷰어)'인지 확인해주세요.</p>
          </div>
        `;
      };

      document.body.appendChild(script);
    }

    // 시트 응답 콜백 함수
    window.handleSheetData = function(json) {
      try {
        const rows = json.table.rows;
        games = [];

        rows.forEach(r => {
          const c = r.c;
          if (!c || !c[0] || !c[0].v) return;

          const title = String(c[0].v).trim();
          const category = c[1] && c[1].v ? String(c[1].v).trim() : '기타';
          const desc = c[2] && c[2].v ? String(c[2].v).trim() : '';
          const url = c[3] && c[3].v ? String(c[3].v).trim() : '#';
          const thumb = c[4] && c[4].v ? String(c[4].v).trim() : 'https://cdn-icons-png.flaticon.com/512/566/566985.png';

          games.push({ title, category, desc, url, thumb });
        });

        renderCategories();
        renderGames();
      } catch (err) {
        console.error("데이터 파싱 실패:", err);
        document.getElementById('gameList').innerHTML = `
          <div class="status-msg">
            <i class="fa-solid fa-circle-exclamation" style="color: #ef4444;"></i>
            <p>시트 데이터를 정리하는 중 오류가 발생했습니다.</p>
          </div>
        `;
      }
    };

    // 카테고리 칩 렌더링
    function renderCategories() {
      const catContainer = document.getElementById('categoryTabs');
      const baseCategories = ['수학', '영어', '과학', '역사'];
      const extraCategories = games
        .map(g => g.category)
        .filter(cat => cat && !baseCategories.includes(cat));

      const uniqueCategories = ['전체', ...baseCategories, ...new Set(extraCategories)];
      catContainer.innerHTML = '';

      uniqueCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${selectedCategory === cat ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          selectedCategory = cat;
          renderCategories();
          renderGames();
        };
        catContainer.appendChild(btn);
      });
    }

    // 게임 목록 카드 렌더링 (레벨, 진행률 제거 완료)
    function renderGames() {
      const listContainer = document.getElementById('gameList');
      listContainer.innerHTML = '';

      const filtered = games.filter(g => {
        const matchCat = selectedCategory === '전체' || g.category === selectedCategory;
        const matchSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            g.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="status-msg">
            <i class="fa-regular fa-folder-open"></i>
            <p>해당하는 게임이 없습니다.</p>
          </div>
        `;
        return;
      }

      const defaultThumb = "https://cdn-icons-png.flaticon.com/512/566/566985.png";

      filtered.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img class="card-thumb" src="${game.thumb}" alt="${game.title}" onerror="this.src='${defaultThumb}'" />
          <div class="card-info">
            <div class="card-title" title="${game.title}">${game.title}</div>
            <div class="card-desc" title="${game.desc}">${game.desc || '학습 게임을 즐겨보세요!'}</div>
            <div class="card-bottom">
              <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="play-btn">플레이</a>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // 실시간 검색창 이벤트
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGames();
    });

    // 시작 시 실행
    fetchGamesFromSheet();
  </script>
</body>
</html>
